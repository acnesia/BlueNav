name: BlueNav native Windows
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bluenav-native-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate native customization
        run: |
          python tools/bluenav/apply_native.py --check
          python -m unittest discover -s tools/bluenav -p 'test_*.py' -v
      - name: Report build availability
        env:
          BUILD_RUNNER: ${{ vars.BLUENAV_WINDOWS_RUNNER }}
        run: |
          if [ -z "$BUILD_RUNNER" ]; then
            echo '### Compilation native non demarree' >> "$GITHUB_STEP_SUMMARY"
            echo 'Configurer BLUENAV_WINDOWS_RUNNER avec le label du runner Windows dedie. Aucun executable Electron ne sera publie.' >> "$GITHUB_STEP_SUMMARY"
          fi
  build-windows:
    needs: validate
    if: github.event_name != 'pull_request' && vars.BLUENAV_WINDOWS_RUNNER != ''
    runs-on: ${{ vars.BLUENAV_WINDOWS_RUNNER }}
    timeout-minutes: 1440
    env:
      DEPOT_TOOLS_WIN_TOOLCHAIN: '0'
      DEPOT_TOOLS_METRICS: '0'
      GIT_TERMINAL_PROMPT: '0'
      use_remoteexec: 'false'
    defaults:
      run:
        shell: pwsh
        working-directory: native/src/brave
    steps:
      - uses: actions/checkout@v4
        with:
          path: native/src/brave
          fetch-depth: 1
          persist-credentials: false
      - name: Check Windows build machine
        run: ./tools/bluenav/check_runner.ps1
      - uses: actions/setup-node@v4
        with:
          node-version: '24.16.0'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned pnpm
        run: |
          npm install --global pnpm@11.11.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install Brave dependencies
        run: |
          pnpm install --frozen-lockfile
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Synchronize pinned Chromium and apply upstream patches
        run: |
          node build/commands/scripts/sync.ts --init --no-history --target_os win --target_arch x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Apply BlueNav configuration
        run: |
          python tools/bluenav/apply_native.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Compile browser and installer
        run: ./tools/bluenav/build_windows.ps1
      - name: Upload native installer and provenance
        uses: actions/upload-artifact@v4
        with:
          name: BlueNav-native-Windows-x64-${{ github.sha }}
          path: native/src/brave/artifacts/native/*
          if-no-files-found: error
          retention-days: 14
