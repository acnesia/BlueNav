name: 🚀 BlueNav Browser Build & Release

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Type de build'
        required: true
        default: 'desktop-installer'
        type: choice
        options:
          - desktop-installer
          - portable-exe
          - all

permissions:
  contents: write

jobs:
  build-windows:
    name: 💻 Build BlueNav Windows Installer (.exe)
    runs-on: windows-latest
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: bluenav-desktop/package-lock.json

      - name: 📦 Install Dependencies
        working-directory: bluenav-desktop
        run: |
          npm ci || npm install

      - name: 🛠️ Build BlueNav Windows Executable & Installer
        working-directory: bluenav-desktop
        run: |
          npm run build:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 📤 Upload Build Artifacts (.exe)
        uses: actions/upload-artifact@v4
        with:
          name: BlueNav-Windows-x64
          path: |
            bluenav-desktop/dist/*.exe
            bluenav-desktop/dist/*.blockmap
          retention-days: 14

      - name: 🏷️ Create GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: bluenav-desktop/dist/*.exe
          name: BlueNav ${{ github.ref_name }}
          body: |
            ## 🌐 BlueNav Browser - Release ${{ github.ref_name }}
            
            Bienvenue dans la version officielle de **BlueNav**, le navigateur haute performance axé sur la vie privée et l'intelligence artificielle native.
            
            ### ✨ Fonctionnalités clés :
            - 🛡️ **BlueShields Engine** : Blocage avancé des traqueurs et publicités.
            - 🤖 **BlueAI Copilot** : Assistant IA intégré (Gemini, Claude, GPT, Ollama local).
            - 🎨 **Design Électrique & Cyber Blue** : Interface ergonomique moderne.
            - 🚀 **Zéro Télémétrie** : Confidentialité totale dès l'installation.
          draft: false
          prerelease: false
